spring:
  application:
    name: mentorai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mentorai}
    username: ${DATABASE_USERNAME:mentorai}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mentorai:
  market:
    enabled: ${MARKET_COLLECTION_ENABLED:false}
    refresh-on-start: ${MARKET_REFRESH_ON_START:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT8H}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
  level:
    root: INFO
    com.mentorai: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
