debug: false

spring:
  datasource:
    url: jdbc:h2:mem:mentorai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

mentorai:
  cors:
    allowed-origin: http://localhost:3000
  security:
    jwt:
      secret: test-only-secret-that-is-more-than-thirty-two-bytes-long
      expiration: PT1H

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
