services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mentorai
      POSTGRES_USER: ${DATABASE_USERNAME:-mentorai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mentorai-local-only}
    ports:
      - "5432:5432"
    volumes:
      - mentorai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - mentorai-ollama:/root/.ollama

volumes:
  mentorai-postgres:
  mentorai-ollama:
